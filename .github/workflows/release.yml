name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish ad-hoc release
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Resources/Info.plist)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

      - name: Check repository for secrets
        run: ./script/check_repository_secrets.sh

      - name: Run tests
        run: >
          swift test
          --disable-sandbox
          --disable-keychain
          --only-use-versions-from-resolved-file

      - name: Build ad-hoc Universal ZIP and DMG
        env:
          CODESIGN_IDENTITY: "-"
        run: ./script/package_release.sh

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          (
            cd outputs
            shasum -a 256 \
              "AriaLane-$version-macOS-universal.zip" \
              "AriaLane-$version-macOS-universal.dmg" \
              > SHA256SUMS.txt
          )

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          tag="${{ steps.version.outputs.tag }}"
          notes="$RUNNER_TEMP/release-notes.md"
          assets=(
            "outputs/AriaLane-$version-macOS-universal.dmg"
            "outputs/AriaLane-$version-macOS-universal.zip"
            "outputs/SHA256SUMS.txt"
          )

          printf '%s\n' \
            "# AriaLane $version" \
            "" \
            "这是一个使用 ad-hoc 签名、尚未经过 Apple 公证的公开版本。" \
            "" \
            "## 安装" \
            "" \
            "1. 下载 DMG 并把 AriaLane 拖入 Applications。" \
            "2. 首次启动时，在 Finder 中右键点按 AriaLane，选择“打开”。" \
            "3. 如果仍被阻止，请前往“系统设置 → 隐私与安全性”，选择“仍要打开”。" \
            "" \
            "请只从本仓库下载，并使用 SHA256SUMS.txt 校验安装包。" \
            > "$notes"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
            gh release edit "$tag" \
              --target "$GITHUB_SHA" \
              --title "AriaLane $version" \
              --notes-file "$notes"
          else
            gh release create "$tag" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "AriaLane $version" \
              --notes-file "$notes"
          fi
